name: UI Instrumentation Tests

on:
  pull_request:
    branches: [ "main", "develop" ]
    types: [ labeled ]

permissions:
  contents: read

concurrency:
  group: ui-tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-ui-tests:
    name: Android UI Tests
    if: github.event.label.name == 'test:UI'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.alma.climbingtraining.ui.flyingloto.FlyingLotoFlowInstrumentationTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 7
